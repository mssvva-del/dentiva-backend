name: Claude Code Review

# Automated Anthropic review on every PR. Advisory — it comments, it does not gate
# merges. Requires the ANTHROPIC_API_KEY repo secret (Settings → Secrets → Actions).
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Advisory: never block a merge — even on a missing key or action error.
    continue-on-error: true
    # Skip when the key isn't configured yet, so PRs aren't blocked by a red job.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Review this PR for the Dentovox backend (FastAPI, async SQLAlchemy 2,
            Postgres RLS, HIPAA-scoped). Report only issues that affect
            correctness, security, money, or PHI — skip style nits.

            Prioritise:
            - Tenant isolation: any query/route that could read or write across
              practices, or bypass RLS / the tenant GUC.
            - PHI safety: patient data or secrets reaching logs, error messages,
              the repo, or a BAA-less vendor (Groq must stay out of the PHI path).
            - Auth/permissions: an endpoint missing its permission gate, or a
              lower role reaching higher-role data.
            - Reliability: unhandled external-service failures, non-idempotent
              webhooks/crons, money-metering double-counts.
            - Tests: critical paths (booking, billing, disclosure gates, access
              control) left uncovered.

            For each finding give file:line and the concrete failure scenario.
          claude_args: |
            {
              "model": "claude-sonnet-5"
            }
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
