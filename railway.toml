[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Use the same entrypoint as the Docker image so cloud + local behave identically.
# start.sh runs migrations then binds ${PORT:-8000}; never hardcode the port.
startCommand = "bash start.sh"
healthcheckPath = "/health"
# Generous window: first boot runs migrations before uvicorn answers /health.
healthcheckTimeout = 300
restartPolicyType = "on_failure"
